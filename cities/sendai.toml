# Settings for Sendai, read from its GTFS feed (python3 data/fetch_city.py sendai wrote this file;
# edit it freely, the script does not overwrite it). Every setting not named here keeps its
# default in busnet/assumptions.py, as for Baku; see docs/configuration.md.
#   python3 measure.py --config cities/sendai.toml --out output/cities/sendai
#   python3 redesign.py --config cities/sendai.toml --out output/cities/sendai/redesign

[data]
gtfs = "../data/cities/sendai/gtfs.zip"
population = "../data/cities/sendai/kontur_population_JP_20231101.gpkg"
destinations = [
    "../data/cities/sendai/osm_education.json",
    "../data/cities/sendai/osm_health.json",
    "../data/cities/sendai/osm_shopping.json",
    "../data/cities/sendai/osm_offices.json",
    "../data/cities/sendai/osm_transport.json",
]

[service]
service_hours = 15                   # the hours of service the feed's timetable shows (measure.py reports them)
headway_from_ridership = false       # no counts in the format of BakuBus's
reference_fleet = 0                  # buses in daily service, if known

[redesign]
redesign_protected_routes = []       # route numbers the search must leave as they are
