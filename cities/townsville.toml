# Settings for Townsville, read from its GTFS feed (python3 data/fetch_city.py townsville wrote this file;
# edit it freely, the script does not overwrite it). Every setting not named here keeps its
# default in busnet/assumptions.py, as for Baku; see docs/configuration.md.
#   python3 measure.py --config cities/townsville.toml --out output/cities/townsville
#   python3 redesign.py --config cities/townsville.toml --out output/cities/townsville/redesign

[data]
gtfs = "../data/cities/townsville/gtfs.zip"
population = "../data/cities/townsville/kontur_population_AU_20231101.gpkg"
destinations = [
    "../data/cities/townsville/osm_education.json",
    "../data/cities/townsville/osm_health.json",
    "../data/cities/townsville/osm_shopping.json",
    "../data/cities/townsville/osm_offices.json",
    "../data/cities/townsville/osm_transport.json",
]

[service]
service_hours = 14                   # the hours of service the feed's timetable shows (measure.py reports them)
headway_from_ridership = false       # no counts in the format of BakuBus's
reference_fleet = 0                  # buses in daily service, if known

[redesign]
redesign_protected_routes = []       # route numbers the search must leave as they are
