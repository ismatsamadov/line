# Settings for Addis Ababa, read from its GTFS feed (python3 data/fetch_city.py addis_ababa wrote this file;
# edit it freely, the script does not overwrite it). Every setting not named here keeps its
# default in busnet/assumptions.py, as for Baku; see docs/configuration.md.
#   python3 measure.py --config cities/addis_ababa.toml --out output/cities/addis_ababa
#   python3 redesign.py --config cities/addis_ababa.toml --out output/cities/addis_ababa/redesign

[data]
gtfs = "../data/cities/addis_ababa/gtfs.zip"
population = "../data/cities/addis_ababa/kontur_population_ET_20231101.gpkg"
destinations = [
    "../data/cities/addis_ababa/osm_education.json",
    "../data/cities/addis_ababa/osm_health.json",
    "../data/cities/addis_ababa/osm_shopping.json",
    "../data/cities/addis_ababa/osm_offices.json",
    "../data/cities/addis_ababa/osm_transport.json",
]

[service]
service_hours = 17                   # the hours of service the feed's timetable shows (measure.py reports them)
headway_from_ridership = false       # no counts in the format of BakuBus's
reference_fleet = 0                  # buses in daily service, if known

[redesign]
redesign_protected_routes = []       # route numbers the search must leave as they are
