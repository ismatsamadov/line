# Settings for Dublin, read from its GTFS feed (python3 data/fetch_city.py dublin wrote this file;
# edit it freely, the script does not overwrite it). Every setting not named here keeps its
# default in busnet/assumptions.py, as for Baku; see docs/configuration.md.
#   python3 measure.py --config cities/dublin.toml --out output/cities/dublin
#   python3 redesign.py --config cities/dublin.toml --out output/cities/dublin/redesign

[data]
gtfs = "../data/cities/dublin/gtfs.zip"
population = "../data/cities/dublin/kontur_population_IE_20231101.gpkg"
destinations = [
    "../data/cities/dublin/osm_education.json",
    "../data/cities/dublin/osm_health.json",
    "../data/cities/dublin/osm_shopping.json",
    "../data/cities/dublin/osm_offices.json",
    "../data/cities/dublin/osm_transport.json",
]

[service]
service_hours = 18                   # the hours of service the feed's timetable shows (measure.py reports them)
headway_from_ridership = false       # no counts in the format of BakuBus's
reference_fleet = 0                  # buses in daily service, if known

[redesign]
redesign_protected_routes = []       # route numbers the search must leave as they are
